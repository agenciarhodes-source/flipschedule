name: Finalize PR 44 account email verification

on:
  push:
    branches:
      - feat/account-email-verification

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/account-email-verification
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install current dependencies
        run: pnpm install --frozen-lockfile

      - name: Implement account email verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema_path = Path("prisma/schema.prisma")
          schema = schema_path.read_text()
          old = "enum TransactionalEmailKind {\n  PASSWORD_RESET\n}"
          new = "enum TransactionalEmailKind {\n  PASSWORD_RESET\n  EMAIL_VERIFICATION\n}"
          if old not in schema and "EMAIL_VERIFICATION" not in schema:
              raise SystemExit("TransactionalEmailKind enum not found")
          schema_path.write_text(schema.replace(old, new, 1))

          docs_readme = Path("docs/README.md")
          readme = docs_readme.read_text()
          item = "- [`ACCOUNT_EMAIL_VERIFICATION.md`](ACCOUNT_EMAIL_VERIFICATION.md): verificação segura do e-mail principal da conta."
          if item not in readme:
              docs_readme.write_text(readme.rstrip() + "\n" + item + "\n")

          roadmap_path = Path("docs/ROADMAP.md")
          roadmap = roadmap_path.read_text()
          heading = "## PR 44 — verificação do e-mail principal"
          if heading not in roadmap:
              roadmap_path.write_text(roadmap.rstrip() + "\n\n" + heading + "\n\nImplementado no código: verificação manual e opcional do e-mail principal por Better Auth, template local, entrega transacional idempotente, timestamp de confirmação, interface de conta e testes. O login continua permitido para contas ainda não verificadas. Não executados: ativação do Resend, envio real, configuração de domínio, DNS, webhook externo, staging externo ou production.\n")
          PY

          cat > lib/email/contract.ts <<'EOF'
          import "server-only";

          export type TransactionalEmailKind = "PASSWORD_RESET" | "EMAIL_VERIFICATION";
          export type TransactionalEmailProviderName = "resend";

          export type TransactionalEmailMessage = {
            kind: TransactionalEmailKind;
            recipientEmail: string;
            subject: string;
            html: string;
            text: string;
            idempotencyKey: string;
            replyTo?: string;
          };

          export type TransactionalEmailSendResult = {
            provider: TransactionalEmailProviderName;
            providerMessageId: string;
          };

          export interface TransactionalEmailProvider {
            send(message: TransactionalEmailMessage): Promise<TransactionalEmailSendResult>;
          }

          export type TransactionalEmailErrorCode =
            | "EMAIL_PROVIDER_DISABLED"
            | "EMAIL_PROVIDER_MISCONFIGURED"
            | "EMAIL_EXTERNAL_EFFECTS_DISABLED"
            | "EMAIL_RECIPIENT_SUPPRESSED"
            | "EMAIL_PROVIDER_REQUEST_FAILED"
            | "EMAIL_PROVIDER_RESPONSE_INVALID";

          export class TransactionalEmailError extends Error {
            override name = "TransactionalEmailError";

            constructor(
              public readonly code: TransactionalEmailErrorCode,
              public readonly providerStatus?: number,
            ) {
              super("A entrega transacional de e-mail não está disponível.");
            }
          }

          export function getTransactionalEmailErrorCode(error: unknown): TransactionalEmailErrorCode {
            return error instanceof TransactionalEmailError ? error.code : "EMAIL_PROVIDER_REQUEST_FAILED";
          }
          EOF

          cat > lib/email/service.ts <<'EOF'
          import "server-only";

          import { normalizeEmail } from "@/lib/auth/utils";
          import { getPrismaClient } from "@/lib/db/client";
          import { structuredLog } from "@/lib/observability/logger";
          import { getTransactionalEmailConfiguration } from "./config";
          import {
            TransactionalEmailError,
            getTransactionalEmailErrorCode,
            type TransactionalEmailKind,
          } from "./contract";
          import { fingerprintEmailAddress } from "./fingerprint";
          import { getTransactionalEmailProvider } from "./provider";

          export type SendTransactionalEmailInput = {
            kind: TransactionalEmailKind;
            deliveryReference: string;
            recipientEmail: string;
            subject: string;
            html: string;
            text: string;
          };

          const resumableStatuses = new Set(["PENDING", "FAILED"]);
          const namespaces: Record<TransactionalEmailKind, string> = {
            PASSWORD_RESET: "password-reset",
            EMAIL_VERIFICATION: "email-verification",
          };

          function buildIdempotencyKey(input: Pick<SendTransactionalEmailInput, "kind" | "deliveryReference">) {
            return `${namespaces[input.kind]}/${input.deliveryReference}`.slice(0, 256);
          }

          export async function sendTransactionalEmail(
            input: SendTransactionalEmailInput,
            env: Record<string, string | undefined> = process.env,
          ) {
            const configuration = getTransactionalEmailConfiguration(env);
            if (configuration.provider === "disabled") {
              throw new TransactionalEmailError("EMAIL_PROVIDER_DISABLED");
            }

            const prisma = getPrismaClient();
            const provider = getTransactionalEmailProvider(env);
            const recipientEmail = normalizeEmail(input.recipientEmail);
            const recipientFingerprint = fingerprintEmailAddress(recipientEmail, configuration.recipientHashKey);
            const idempotencyKey = buildIdempotencyKey(input);

            const suppression = await prisma.emailSuppression.findUnique({
              where: {
                recipientFingerprint_provider: {
                  recipientFingerprint,
                  provider: configuration.provider,
                },
              },
              select: { liftedAt: true },
            });

            const delivery = await prisma.transactionalEmailDelivery.upsert({
              where: { idempotencyKey },
              create: {
                passwordResetTokenId: input.kind === "PASSWORD_RESET" ? input.deliveryReference : null,
                kind: input.kind,
                provider: configuration.provider,
                idempotencyKey,
                recipientFingerprint,
                status: suppression && !suppression.liftedAt ? "SUPPRESSED" : "PENDING",
                suppressedAt: suppression && !suppression.liftedAt ? new Date() : null,
                failureCode: suppression && !suppression.liftedAt ? "EMAIL_RECIPIENT_SUPPRESSED" : null,
              },
              update: { idempotencyKey },
              select: { id: true, status: true, providerMessageId: true },
            });

            if (suppression && !suppression.liftedAt) {
              structuredLog("warn", "email.transactional.suppressed", {
                provider: configuration.provider,
                kind: input.kind,
                resourceType: "TransactionalEmailDelivery",
                resourceId: delivery.id,
                errorCode: "EMAIL_RECIPIENT_SUPPRESSED",
              });
              throw new TransactionalEmailError("EMAIL_RECIPIENT_SUPPRESSED");
            }

            if (delivery.providerMessageId && !resumableStatuses.has(delivery.status)) {
              return { provider: configuration.provider, providerMessageId: delivery.providerMessageId } as const;
            }

            structuredLog("info", "email.transactional.send_started", {
              provider: configuration.provider,
              kind: input.kind,
              resourceType: "TransactionalEmailDelivery",
              resourceId: delivery.id,
              status: "PENDING",
            });

            try {
              const result = await provider.send({
                kind: input.kind,
                recipientEmail,
                subject: input.subject,
                html: input.html,
                text: input.text,
                idempotencyKey,
                ...(configuration.replyTo ? { replyTo: configuration.replyTo } : {}),
              });
              const sentAt = new Date();
              await prisma.transactionalEmailDelivery.update({
                where: { id: delivery.id },
                data: {
                  providerMessageId: result.providerMessageId,
                  status: "SENT",
                  sentAt,
                  lastEventAt: sentAt,
                  failureCode: null,
                },
              });
              structuredLog("info", "email.transactional.sent", {
                provider: result.provider,
                kind: input.kind,
                resourceType: "TransactionalEmailDelivery",
                resourceId: delivery.id,
                status: "SENT",
              });
              return result;
            } catch (error) {
              const errorCode = getTransactionalEmailErrorCode(error);
              await prisma.transactionalEmailDelivery.update({
                where: { id: delivery.id },
                data: { status: "FAILED", failedAt: new Date(), failureCode: errorCode },
              });
              structuredLog("warn", "email.transactional.send_failed", {
                provider: configuration.provider,
                kind: input.kind,
                resourceType: "TransactionalEmailDelivery",
                resourceId: delivery.id,
                errorCode,
              });
              throw error instanceof TransactionalEmailError
                ? error
                : new TransactionalEmailError("EMAIL_PROVIDER_REQUEST_FAILED");
            }
          }
          EOF

          mkdir -p lib/email/templates lib/auth/email-verification
          cat > lib/email/templates/email-verification.ts <<'EOF'
          const escapeHtml = (value: string) =>
            value.replaceAll("&", "&amp;").replaceAll('"', "&quot;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");

          export function renderAccountEmailVerification(input: { verificationUrl: string; expiresInMinutes: number }) {
            const verificationUrl = escapeHtml(input.verificationUrl);
            const subject = "Confirme seu e-mail no FlipSchedule";
            const text = [
              "Confirme seu e-mail no FlipSchedule",
              "",
              `Abra o link abaixo para confirmar que este endereço pertence a você. O link expira em ${input.expiresInMinutes} minutos.`,
              input.verificationUrl,
              "",
              "Caso você não tenha solicitado esta confirmação, ignore esta mensagem.",
            ].join("\n");
            const html = `<!doctype html><html lang="pt-BR"><body style="font-family:Arial,sans-serif;color:#18181b;line-height:1.6"><main style="max-width:560px;margin:0 auto;padding:32px"><h1 style="font-size:24px">Confirme seu e-mail</h1><p>Abra o botão abaixo para confirmar que este endereço pertence a você. O link expira em ${input.expiresInMinutes} minutos.</p><p style="margin:28px 0"><a href="${verificationUrl}" style="display:inline-block;padding:12px 18px;border-radius:8px;background:#18181b;color:#fff;text-decoration:none">Confirmar e-mail</a></p><p style="font-size:13px;color:#71717a">Caso você não tenha solicitado esta confirmação, ignore esta mensagem.</p></main></body></html>`;
            return { subject, html, text };
          }
          EOF

          cat > lib/auth/email-verification/delivery.ts <<'EOF'
          import "server-only";

          import { createHash } from "node:crypto";

          import { renderAccountEmailVerification } from "@/lib/email/templates/email-verification";
          import { sendTransactionalEmail } from "@/lib/email/service";

          const verificationExpiresInMinutes = 60;

          export function buildEmailVerificationDeliveryReference(token: string) {
            return createHash("sha256").update(`email-verification:${token}`).digest("hex");
          }

          export async function deliverAccountEmailVerification(input: {
            recipientEmail: string;
            verificationUrl: string;
            token: string;
          }) {
            const rendered = renderAccountEmailVerification({
              verificationUrl: input.verificationUrl,
              expiresInMinutes: verificationExpiresInMinutes,
            });
            return sendTransactionalEmail({
              kind: "EMAIL_VERIFICATION",
              deliveryReference: buildEmailVerificationDeliveryReference(input.token),
              recipientEmail: input.recipientEmail,
              subject: rendered.subject,
              html: rendered.html,
              text: rendered.text,
            });
          }
          EOF

          cat > lib/auth/server.ts <<'EOF'
          import "server-only";

          import { randomUUID } from "node:crypto";

          import { betterAuth } from "better-auth";
          import { hashPassword, verifyPassword } from "better-auth/crypto";
          import { prismaAdapter } from "better-auth/adapters/prisma";
          import { nextCookies } from "better-auth/next-js";

          import type { PrismaClient } from "@/generated/prisma/client";
          import { getPrismaClient } from "@/lib/db/client";
          import { structuredLog } from "@/lib/observability/logger";
          import { readAuthConfig } from "./config";
          import { deliverAccountEmailVerification } from "./email-verification/delivery";
          import { normalizeEmail } from "./utils";

          export function createAuth(prisma?: PrismaClient) {
            const authConfig = readAuthConfig();
            const database = prisma ?? getPrismaClient();
            const generateAuthId = () => randomUUID();

            return betterAuth({
              appName: "FlipSchedule",
              baseURL: authConfig.baseURL!,
              secret: authConfig.secret!,
              trustedOrigins: authConfig.trustedOrigins,
              database: prismaAdapter(database, { provider: "postgresql" }),
              plugins: prisma ? [] : [nextCookies()],
              emailVerification: {
                expiresIn: 60 * 60,
                sendOnSignUp: false,
                autoSignInAfterVerification: false,
                sendVerificationEmail: async ({ user, url, token }) => {
                  await deliverAccountEmailVerification({
                    recipientEmail: user.email,
                    verificationUrl: url,
                    token,
                  });
                },
                afterEmailVerification: async (user) => {
                  await database.user.update({
                    where: { id: user.id },
                    data: { emailVerifiedAt: new Date() },
                  });
                  structuredLog("info", "auth.email_verification.completed", {
                    resourceType: "User",
                    resourceId: user.id,
                    status: "SUCCESS",
                  });
                },
              },
              emailAndPassword: {
                enabled: true,
                disableSignUp: true,
                autoSignIn: false,
                requireEmailVerification: false,
                password: {
                  hash: async (password) => hashPassword(password),
                  verify: async ({ hash, password }) => verifyPassword({ hash, password }),
                },
              },
              user: {
                modelName: "User",
                fields: {
                  name: "displayName",
                  email: "emailNormalized",
                  emailVerified: "emailVerified",
                },
              },
              session: {
                modelName: "AuthSession",
                expiresIn: 60 * 60 * 24 * 14,
                updateAge: 60 * 60 * 24,
                storeSessionInDatabase: true,
                cookieCache: { enabled: false },
              },
              account: {
                modelName: "AuthAccount",
              },
              verification: {
                modelName: "AuthVerification",
              },
              advanced: {
                generateId: generateAuthId,
                useSecureCookies: authConfig.isSecureRuntime,
                database: {
                  generateId: generateAuthId,
                },
              },
              databaseHooks: {
                user: {
                  create: {
                    before: async (user) => ({
                      data: {
                        ...user,
                        email: normalizeEmail(user.email),
                        emailVerified: false,
                      },
                    }),
                  },
                },
              },
            });
          }

          let cachedAuth: ReturnType<typeof createAuth> | undefined;

          export function getAuth() {
            cachedAuth ??= createAuth();
            return cachedAuth;
          }

          type Auth = ReturnType<typeof createAuth>;
          export type AuthSession = Auth["$Infer"]["Session"];
          export type AuthUser = AuthSession["user"];
          EOF

          cat > lib/auth/client.ts <<'EOF'
          "use client";

          import { createAuthClient } from "better-auth/react";

          type AuthResult = { error: unknown | null };
          type AuthClient = {
            signIn: {
              email: (input: { email: string; password: string; callbackURL?: string }) => Promise<AuthResult>;
            };
            signOut: () => Promise<void>;
            sendVerificationEmail: (input: { email: string; callbackURL?: string }) => Promise<AuthResult>;
          };

          const baseURL = process.env.NEXT_PUBLIC_APP_URL ?? process.env.BETTER_AUTH_URL ?? "http://localhost:3000";

          export const authClient = createAuthClient({ baseURL }) as unknown as AuthClient;
          EOF

          mkdir -p components/modules/settings
          cat > components/modules/settings/account-email-verification.tsx <<'EOF'
          "use client";

          import { useState } from "react";

          import { authClient } from "@/lib/auth/client";

          type RequestState = "idle" | "sending" | "sent" | "error";

          export function AccountEmailVerification(props: {
            email: string;
            verified: boolean;
            tenantSlug: string;
          }) {
            const [state, setState] = useState<RequestState>("idle");

            async function requestVerification() {
              setState("sending");
              try {
                const callbackURL = `/${encodeURIComponent(props.tenantSlug)}/configuracoes?emailVerification=success`;
                const result = await authClient.sendVerificationEmail({ email: props.email, callbackURL });
                setState(result.error ? "error" : "sent");
              } catch {
                setState("error");
              }
            }

            return (
              <section className="card-surface p-5" aria-labelledby="account-email-title">
                <p className="font-mono text-xs uppercase text-primary">Segurança da conta</p>
                <h2 id="account-email-title" className="font-display text-2xl">E-mail principal</h2>
                <p className="mt-2 text-sm text-ink-muted">{props.email}</p>
                <p className="mt-1 text-sm text-ink-muted">
                  {props.verified ? "Endereço confirmado." : "Este endereço ainda não foi confirmado."}
                </p>
                {!props.verified ? (
                  <div className="mt-4 space-y-2">
                    <button
                      type="button"
                      onClick={requestVerification}
                      disabled={state === "sending" || state === "sent"}
                      className="rounded-md bg-primary px-4 py-2 text-sm text-primary-foreground disabled:cursor-not-allowed disabled:opacity-60"
                    >
                      {state === "sending" ? "Enviando…" : state === "sent" ? "E-mail solicitado" : "Confirmar meu e-mail"}
                    </button>
                    {state === "sent" ? <p role="status" className="text-xs text-ink-muted">Confira sua caixa de entrada. O link expira em 60 minutos.</p> : null}
                    {state === "error" ? <p role="alert" className="text-xs text-red-600">A confirmação não está disponível agora. Tente novamente mais tarde.</p> : null}
                  </div>
                ) : null}
              </section>
            );
          }
          EOF

          cat > 'app/(platform)/[tenantSlug]/configuracoes/page.tsx' <<'EOF'
          import { AccountEmailVerification } from "@/components/modules/settings/account-email-verification";
          import { RealSettingsView } from "@/components/modules/settings/real-settings-view";
          import { getApplicationContext } from "@/lib/auth/application-context";
          import { getPrismaClient } from "@/lib/db/client";
          import { createPrismaReaders } from "@/domains/infrastructure/prisma/factory";
          import { TeamService } from "@/domains/infrastructure/prisma/team-service";

          export default async function ConfiguracoesPage() {
            const context = await getApplicationContext();
            const readers = createPrismaReaders(context);
            const [organization, clinics, professionals, procedures, resources, workingHours, consents, team, account] = await Promise.all([
              readers.organization.read(),
              readers.clinics.list({ limit: 100 }),
              readers.professionals.list({ limit: 100 }),
              readers.procedures.list({ limit: 100 }),
              readers.resources.list({ limit: 100 }),
              readers.workingHours.list({ limit: 100 }),
              readers.reports.read({ from: new Date(Date.now() - 365 * 864e5).toISOString(), to: new Date().toISOString() }),
              new TeamService(context).read(),
              getPrismaClient().user.findUniqueOrThrow({
                where: { id: context.userId },
                select: { emailNormalized: true, emailVerified: true },
              }),
            ]);

            return (
              <div className="space-y-6">
                <AccountEmailVerification
                  email={account.emailNormalized}
                  verified={account.emailVerified}
                  tenantSlug={context.tenantSlug}
                />
                <RealSettingsView
                  organization={organization}
                  consentPatients={consents.consentPatients}
                  revokedConsents={consents.revokedConsents}
                  tenantSlug={context.tenantSlug}
                  clinics={clinics.items}
                  professionals={professionals.items}
                  procedures={procedures.items}
                  resources={resources.items}
                  workingHours={workingHours.items}
                  team={team}
                />
              </div>
            );
          }
          EOF

          mkdir -p prisma/migrations/20260805121500_add_email_verification_delivery_kind
          cat > prisma/migrations/20260805121500_add_email_verification_delivery_kind/migration.sql <<'EOF'
          ALTER TYPE "TransactionalEmailKind" ADD VALUE IF NOT EXISTS 'EMAIL_VERIFICATION';
          EOF

          cat > docs/ACCOUNT_EMAIL_VERIFICATION.md <<'EOF'
          # Verificação do e-mail principal

          O PR 44 habilita a verificação manual e opcional do e-mail principal da conta pelo mecanismo nativo do Better Auth.

          ## Comportamento

          - contas existentes continuam podendo entrar sem e-mail verificado;
          - a solicitação parte da tela de configurações autenticada;
          - o link expira em 60 minutos e é consumido pelo Better Auth;
          - a entrega usa o contrato transacional e o adapter Resend do PR 43;
          - o registro de entrega guarda fingerprint HMAC, estado e uma referência derivada por SHA-256, nunca o e-mail, token ou URL em texto bruto;
          - após a confirmação, `emailVerified` e `emailVerifiedAt` representam o estado da conta;
          - bounce, complaint e suppression continuam respeitados pela camada transacional.

          ## Ambientes e efeitos externos

          `EMAIL_PROVIDER=disabled` permanece o padrão. Este PR não cria conta Resend, API key, domínio, DNS, webhook externo ou envio real. Build, testes e CI não realizam rede nem exigem credenciais do provider.

          ## Fora do escopo

          Troca do endereço principal, confirmação pelo endereço antigo, obrigatoriedade de verificação para login e entrega de convites ficam para PRs separados.
          EOF

          cat > tests/account-email-verification.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { describe, expect, it, vi } from "vitest";

          vi.mock("server-only", () => ({}));
          vi.mock("@/lib/email/service", () => ({ sendTransactionalEmail: vi.fn(async () => ({ provider: "resend", providerMessageId: "email_123" })) }));

          describe("account email verification", () => {
            it("renderiza template local sem recursos externos", async () => {
              const { renderAccountEmailVerification } = await import("@/lib/email/templates/email-verification");
              const rendered = renderAccountEmailVerification({
                verificationUrl: "https://app.example.test/api/auth/verify-email?token=opaque-token&callbackURL=%2Ftenant%2Fconfiguracoes",
                expiresInMinutes: 60,
              });
              expect(rendered.subject).toContain("FlipSchedule");
              expect(rendered.html).toContain("Confirmar e-mail");
              expect(rendered.text).toContain("opaque-token");
              expect(rendered.html).toContain("&amp;callbackURL");
              expect(rendered.html).not.toMatch(/<script|<img|https:\/\/fonts\./i);
            });

            it("usa referência opaca e o tipo EMAIL_VERIFICATION", async () => {
              const { sendTransactionalEmail } = await import("@/lib/email/service");
              const { buildEmailVerificationDeliveryReference, deliverAccountEmailVerification } = await import("@/lib/auth/email-verification/delivery");
              const token = "raw-verification-token";
              const reference = buildEmailVerificationDeliveryReference(token);
              expect(reference).toHaveLength(64);
              expect(reference).not.toContain(token);

              await deliverAccountEmailVerification({
                recipientEmail: "owner@example.test",
                verificationUrl: `https://app.example.test/api/auth/verify-email?token=${token}`,
                token,
              });
              expect(sendTransactionalEmail).toHaveBeenCalledWith(expect.objectContaining({
                kind: "EMAIL_VERIFICATION",
                deliveryReference: reference,
                recipientEmail: "owner@example.test",
              }));
            });

            it("mantém a verificação opcional para login", () => {
              const source = readFileSync("lib/auth/server.ts", "utf8");
              expect(source).toContain("emailVerification:");
              expect(source).toContain("requireEmailVerification: false");
              expect(source).toContain("emailVerifiedAt: new Date()");
            });

            it("expõe somente o estado necessário na interface", () => {
              const source = readFileSync("components/modules/settings/account-email-verification.tsx", "utf8");
              expect(source).toContain("sendVerificationEmail");
              expect(source).not.toContain("token");
              const schema = readFileSync("prisma/schema.prisma", "utf8");
              expect(schema).toMatch(/enum TransactionalEmailKind[\s\S]*EMAIL_VERIFICATION/);
            });
          });
          EOF

      - name: Format and validate Prisma
        run: |
          pnpm db:format
          pnpm db:validate
          pnpm db:generate

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile

      - name: Targeted tests
        env:
          EMAIL_PROVIDER: disabled
        run: pnpm exec vitest run tests/account-email-verification.test.ts tests/transactional-email.test.ts tests/auth-config.test.ts

      - name: Full quality gate
        env:
          EMAIL_PROVIDER: disabled
        run: pnpm check

      - name: Remove temporary workflow
        run: rm .github/workflows/pr44-account-email-verification.yml

      - name: Commit finalized PR 44
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add secure account email verification"
          git push origin HEAD:feat/account-email-verification
