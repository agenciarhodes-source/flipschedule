name: Human pilot readiness review
on:
  workflow_dispatch:
    inputs:
      confirmation: {required: true, type: string}
      reviewId: {required: true, type: string}
      clinicApproved: {required: true, type: boolean}
      contractApproved: {required: true, type: boolean}
      lgpdApproved: {required: true, type: boolean}
      trainingCompleted: {required: true, type: boolean}
      supportReady: {required: true, type: boolean}
      incidentContactsReady: {required: true, type: boolean}
      pilotWindowApproved: {required: true, type: boolean}
      ownersAssigned: {required: true, type: boolean}
      pauseCriteriaAccepted: {required: true, type: boolean}
      goLiveAccepted: {required: true, type: boolean}
      syntheticDataOnlyConfirmed: {required: true, type: boolean}
permissions: {contents: read}
concurrency: {group: human-pilot-readiness, cancel-in-progress: false}
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env: {CONFIRMATION: "${{ inputs.confirmation }}", REVIEW_ID: "${{ inputs.reviewId }}", SHA: "${{ github.sha }}"}
        run: node -e 'if(process.env.CONFIRMATION!=="REVIEW_SYNTHETIC_HUMAN_PILOT"||!/^[-A-Za-z0-9_.]{1,64}$/.test(process.env.REVIEW_ID)||!/^[a-f0-9]{40}$/.test(process.env.SHA))process.exit(1)'
  review:
    needs: validate
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 10.28.1}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Technical checks (never activates pilot)
        env: {APP_ENV: staging, DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}", DIRECT_DATABASE_URL: "${{ secrets.STAGING_DIRECT_DATABASE_URL }}", BETTER_AUTH_SECRET: "${{ secrets.BETTER_AUTH_SECRET }}", FIELD_ENCRYPTION_KEY: "${{ secrets.FIELD_ENCRYPTION_KEY }}", RATE_LIMIT_HASH_KEY: "${{ secrets.RATE_LIMIT_HASH_KEY }}", RELEASE_ID: "${{ vars.RELEASE_ID }}", OPERATIONAL_MODE: NORMAL, ASAAS_ENVIRONMENT: sandbox, BUILD_SHA: "${{ github.sha }}", BASE_URL: "${{ vars.STAGING_BASE_URL }}", STAGING_BASE_URL: "${{ vars.STAGING_BASE_URL }}", STAGING_ALLOWED_HOSTNAME: "${{ vars.STAGING_ALLOWED_HOSTNAME }}", STAGING_DATABASE_HOSTNAME: "${{ vars.STAGING_DATABASE_HOSTNAME }}", STAGING_DATABASE_NAME: "${{ vars.STAGING_DATABASE_NAME }}", PRODUCTION_HOSTNAME: "${{ vars.PRODUCTION_HOSTNAME }}", PILOT_MODE: 'true', PILOT_DATA_MODE: SYNTHETIC_ONLY, PILOT_TENANT_SLUG: "${{ vars.PILOT_TENANT_SLUG }}", PILOT_TENANT_SLUGS: "${{ vars.PILOT_TENANT_SLUGS }}", EXTERNAL_EFFECTS_MODE: DISABLED, STAGING_SYNTHETIC_USER_EMAIL: "${{ secrets.STAGING_SYNTHETIC_USER_EMAIL }}", STAGING_SYNTHETIC_USER_PASSWORD: "${{ secrets.STAGING_SYNTHETIC_USER_PASSWORD }}"}
        run: pnpm ops:verify-external-staging && pnpm ops:smoke && pnpm ops:authenticated-staging-smoke && pnpm ops:pilot-technical-readiness
      - name: Record sanitized human attestations
        env:
          CLINIC_APPROVED: "${{ inputs.clinicApproved }}"
          CONTRACT_APPROVED: "${{ inputs.contractApproved }}"
          LGPD_APPROVED: "${{ inputs.lgpdApproved }}"
          TRAINING_COMPLETED: "${{ inputs.trainingCompleted }}"
          SUPPORT_READY: "${{ inputs.supportReady }}"
          INCIDENT_CONTACTS_READY: "${{ inputs.incidentContactsReady }}"
          PILOT_WINDOW_APPROVED: "${{ inputs.pilotWindowApproved }}"
          OWNERS_ASSIGNED: "${{ inputs.ownersAssigned }}"
          PAUSE_CRITERIA_ACCEPTED: "${{ inputs.pauseCriteriaAccepted }}"
          GO_LIVE_ACCEPTED: "${{ inputs.goLiveAccepted }}"
          SYNTHETIC_DATA_ONLY_CONFIRMED: "${{ inputs.syntheticDataOnlyConfirmed }}"
        run: pnpm ops:validate-human-pilot-attestations
