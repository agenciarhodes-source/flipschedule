name: Human pilot readiness review
on:
  workflow_dispatch:
    inputs:
      confirmation: {required: true, type: string}
      reviewId: {required: true, type: string}
      clinicApproved: {required: true, type: boolean}
      legalApproved: {required: true, type: boolean}
      trainingCompleted: {required: true, type: boolean}
      supportReady: {required: true, type: boolean}
      incidentContactsReady: {required: true, type: boolean}
      syntheticDataOnlyConfirmed: {required: true, type: boolean}
permissions: {contents: read}
concurrency: {group: human-pilot-readiness, cancel-in-progress: false}
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env: {CONFIRMATION: "${{ inputs.confirmation }}", REVIEW_ID: "${{ inputs.reviewId }}", SHA: "${{ github.sha }}"}
        run: node -e 'if(process.env.CONFIRMATION!=="REVIEW_SYNTHETIC_HUMAN_PILOT"||!/^[-A-Za-z0-9_.]{1,64}$/.test(process.env.REVIEW_ID)||!/^[a-f0-9]{40}$/.test(process.env.SHA))process.exit(1)'
  review:
    needs: validate
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 10.28.1}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Technical checks (never activates pilot)
        env: {APP_ENV: staging, DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}", BUILD_SHA: "${{ github.sha }}", BASE_URL: "${{ vars.STAGING_BASE_URL }}", STAGING_BASE_URL: "${{ vars.STAGING_BASE_URL }}", STAGING_ALLOWED_HOSTNAME: "${{ vars.STAGING_ALLOWED_HOSTNAME }}", STAGING_DATABASE_HOSTNAME: "${{ vars.STAGING_DATABASE_HOSTNAME }}", STAGING_DATABASE_NAME: "${{ vars.STAGING_DATABASE_NAME }}", PRODUCTION_HOSTNAME: "${{ vars.PRODUCTION_HOSTNAME }}", PILOT_MODE: 'true', PILOT_DATA_MODE: SYNTHETIC_ONLY, PILOT_TENANT_SLUG: "${{ vars.PILOT_TENANT_SLUG }}", PILOT_TENANT_SLUGS: "${{ vars.PILOT_TENANT_SLUGS }}", EXTERNAL_EFFECTS_MODE: DISABLED, STAGING_SYNTHETIC_USER_EMAIL: "${{ secrets.STAGING_SYNTHETIC_USER_EMAIL }}", STAGING_SYNTHETIC_USER_PASSWORD: "${{ secrets.STAGING_SYNTHETIC_USER_PASSWORD }}"}
        run: pnpm ops:verify-external-staging && pnpm ops:smoke && pnpm ops:authenticated-staging-smoke && pnpm ops:pilot-technical-readiness
      - name: Record sanitized human attestations
        env: {CLINIC: "${{ inputs.clinicApproved }}", LEGAL: "${{ inputs.legalApproved }}", TRAINING: "${{ inputs.trainingCompleted }}", SUPPORT: "${{ inputs.supportReady }}", INCIDENT: "${{ inputs.incidentContactsReady }}", SYNTHETIC: "${{ inputs.syntheticDataOnlyConfirmed }}"}
        run: node -e 'const ready=Object.values(process.env).filter(Boolean).every(v=>v==="true"); console.log(ready?"READY_FOR_HUMAN_REVIEW":"BLOCKED")'
