name: PR 48 validation

on:
  push:
    branches:
      - feat/platform-customer-access-governance

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-customer-access-governance
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:format
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm exec vitest run tests/platform-customer-governance.test.ts tests/post-login-routing.test.ts
      - run: pnpm check

      - name: Remove temporary workflow after success
        run: |
          rm .github/workflows/pr48-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize PR 48 validation"
          git push origin HEAD:feat/platform-customer-access-governance
