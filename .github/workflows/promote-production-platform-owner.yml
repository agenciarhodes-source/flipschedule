name: Promote production platform owner

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROMOTE_PLATFORM_OWNER to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flipschedule-production-platform-owner-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate confirmation
        if: ${{ github.event.inputs.confirmation != 'PROMOTE_PLATFORM_OWNER' }}
        run: exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate required secrets
        env:
          NEON_PRODUCTION_DIRECT_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          BOOTSTRAP_OWNER_EMAIL: ${{ secrets.BOOTSTRAP_OWNER_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in NEON_PRODUCTION_DIRECT_URL BOOTSTRAP_OWNER_EMAIL; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required production secret: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Confirm production schema is current
        env:
          DIRECT_DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
        run: pnpm db:migrate:production:status

      - name: Promote existing user to platform owner
        env:
          APP_ENV: production
          DIRECT_DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          PLATFORM_OWNER_EMAIL: ${{ secrets.BOOTSTRAP_OWNER_EMAIL }}
          PLATFORM_OWNER_CONFIRMATION: BOOTSTRAP_PLATFORM_OWNER
        run: pnpm auth:bootstrap-platform-owner
