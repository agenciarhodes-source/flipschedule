name: Harden PR 48 manual governance

on:
  push:
    branches:
      - feat/platform-customer-access-governance
    paths:
      - .github/workflows/pr48-security-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-customer-access-governance
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply security fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("domains/infrastructure/platform/customer-service.ts")
          source = path.read_text()
          entitlement = '''      startsAt,
                endsAt,
                reason: `Plano ${input.plan.code} atribuído pela administração da plataforma`,'''
          hardened_entitlement = '''      startsAt,
                endsAt: null,
                reason: `Plano ${input.plan.code} atribuído pela administração da plataforma`,'''
          if entitlement not in source:
              raise SystemExit("Entitlement anchor not found")
          source = source.replace(entitlement, hardened_entitlement, 1)
          raw_reason = 'metadata: { reason: data.reason },'
          if raw_reason not in source:
              raise SystemExit("Audit reason anchor not found")
          source = source.replace(
              raw_reason,
              'metadata: { reasonCode: "OPERATOR_PROVIDED" },',
              1,
          )
          path.write_text(source)

          test_path = Path("tests/platform-customer-governance.test.ts")
          test = test_path.read_text()
          marker = 'expect(source).not.toContain("password: data.temporaryPassword");'
          replacement = marker + '''
              expect(source).toContain("endsAt: null");
              expect(source).toContain('reasonCode: "OPERATOR_PROVIDED"');
              expect(source).not.toContain("metadata: { reason: data.reason }");'''
          if marker not in test:
              raise SystemExit("Governance test anchor not found")
          test_path.write_text(test.replace(marker, replacement, 1))
          PY

      - name: Validate
        run: |
          pnpm db:format
          git diff --exit-code prisma/schema.prisma
          pnpm exec vitest run tests/platform-customer-governance.test.ts tests/post-login-routing.test.ts
          pnpm check

      - name: Remove temporary workflow
        run: rm .github/workflows/pr48-security-fix-once.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden platform client governance"
          git push origin HEAD:feat/platform-customer-access-governance
