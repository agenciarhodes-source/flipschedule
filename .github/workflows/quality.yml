name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  promote-configured-owner:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'agenciarhodes-source/flipschedule' && github.head_ref == 'ops/promote-platform-owner-20260806' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: flipschedule-production-platform-owner-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate required production secrets
        env:
          NEON_PRODUCTION_DIRECT_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          BOOTSTRAP_OWNER_EMAIL: ${{ secrets.BOOTSTRAP_OWNER_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in NEON_PRODUCTION_DIRECT_URL BOOTSTRAP_OWNER_EMAIL; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required production secret: ${secret_name}" >&2
              exit 1
            fi
          done
      - name: Confirm production schema is current
        env:
          DIRECT_DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
        run: pnpm db:migrate:production:status
      - name: Promote configured user to platform owner
        env:
          APP_ENV: production
          DIRECT_DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          PLATFORM_OWNER_EMAIL: ${{ secrets.BOOTSTRAP_OWNER_EMAIL }}
          PLATFORM_OWNER_CONFIRMATION: BOOTSTRAP_PLATFORM_OWNER
        run: pnpm auth:bootstrap-platform-owner
