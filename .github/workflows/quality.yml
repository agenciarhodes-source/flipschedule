name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-multi-clinic-schema:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/multi-clinic-operations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply schema patch and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-multi-clinic-schema-once.mjs
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/quality.yml
          rm scripts/apply-multi-clinic-schema-once.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma .github/workflows/quality.yml scripts/apply-multi-clinic-schema-once.mjs
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "feat: persist clinic access scope schema"
          git push origin HEAD:${GITHUB_HEAD_REF}

  quality:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/multi-clinic-operations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
