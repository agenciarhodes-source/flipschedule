name: Secure PR 44 email verification endpoint

on:
  push:
    branches:
      - feat/account-email-verification

permissions:
  contents: write

jobs:
  secure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/account-email-verification
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require authenticated matching account
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server_path = Path('lib/auth/server.ts')
          server = server_path.read_text()
          import_marker = 'import { betterAuth } from "better-auth";\n'
          auth_import = 'import { APIError, createAuthMiddleware, getSessionFromCtx } from "better-auth/api";\n'
          if auth_import not in server:
              server = server.replace(import_marker, import_marker + auth_import, 1)

          hook = '''    hooks: {
              before: createAuthMiddleware(async (ctx) => {
                if (ctx.path !== "/send-verification-email") return;

                const session = await getSessionFromCtx(ctx);
                if (!session) {
                  throw new APIError("UNAUTHORIZED", {
                    message: "Authentication required",
                  });
                }

                const requestedEmail = typeof ctx.body?.email === "string" ? normalizeEmail(ctx.body.email) : "";
                if (!requestedEmail || requestedEmail !== normalizeEmail(session.user.email)) {
                  throw new APIError("FORBIDDEN", {
                    message: "Email verification request not allowed",
                  });
                }
              }),
            },
          '''
          marker = '    databaseHooks: {\n'
          if 'ctx.path !== "/send-verification-email"' not in server:
              if marker not in server:
                  raise SystemExit('databaseHooks marker not found')
              server = server.replace(marker, hook + marker, 1)
          server_path.write_text(server)

          test_path = Path('tests/account-email-verification.test.ts')
          test = test_path.read_text()
          new_test = '''
            it("protege o endpoint manual com sessão e e-mail correspondente", () => {
              const source = readFileSync("lib/auth/server.ts", "utf8");
              expect(source).toContain('ctx.path !== "/send-verification-email"');
              expect(source).toContain("getSessionFromCtx(ctx)");
              expect(source).toContain("requestedEmail !== normalizeEmail(session.user.email)");
              expect(source).toContain('new APIError("UNAUTHORIZED"');
              expect(source).toContain('new APIError("FORBIDDEN"');
            });
          '''
          closing = '\n});\n'
          if 'protege o endpoint manual com sessão' not in test:
              if not test.endswith(closing):
                  raise SystemExit('test closing marker not found')
              test = test[:-len(closing)] + new_test + closing
          test_path.write_text(test)

          docs_path = Path('docs/ACCOUNT_EMAIL_VERIFICATION.md')
          docs = docs_path.read_text()
          sentence = '- o endpoint manual exige uma sessão válida e aceita somente o e-mail da própria conta autenticada;\n'
          behavior = '## Comportamento\n\n'
          if sentence not in docs:
              docs = docs.replace(behavior, behavior + sentence, 1)
          docs_path.write_text(docs)
          PY

      - name: Targeted validation
        env:
          EMAIL_PROVIDER: disabled
        run: |
          pnpm db:validate
          pnpm db:generate
          pnpm exec vitest run tests/account-email-verification.test.ts tests/transactional-email.test.ts tests/auth-config.test.ts

      - name: Full quality gate
        env:
          EMAIL_PROVIDER: disabled
        run: pnpm check

      - name: Remove temporary workflow
        run: rm .github/workflows/pr44-authenticated-email-verification.yml

      - name: Commit secure implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: require session for email verification requests"
          git push origin HEAD:feat/account-email-verification
