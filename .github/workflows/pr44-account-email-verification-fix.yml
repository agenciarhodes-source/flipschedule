name: Finalize PR 44 strict type fixes

on:
  push:
    branches:
      - feat/account-email-verification

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/account-email-verification
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reapply implementation and strict type fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr44-account-email-verification.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == '- name: Implement account email verification')
          run_line = next(i for i in range(start, len(source)) if source[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(source)) if source[i].strip() == '- name: Format and validate Prisma')
          commands = [line[10:] if line.startswith('          ') else line for line in source[run_line + 1:end]]
          Path('/tmp/pr44-implement.sh').write_text('\n'.join(commands) + '\n')
          PY
          bash /tmp/pr44-implement.sh
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('lib/email/service.ts')
          output = []
          inside_log = False
          for line in service_path.read_text().splitlines():
              if 'structuredLog(' in line:
                  inside_log = True
              if inside_log and line.strip() == 'kind: input.kind,':
                  continue
              output.append(line)
              if inside_log and line.strip() == '});':
                  inside_log = False
          service_path.write_text('\n'.join(output) + '\n')

          server_path = Path('lib/auth/server.ts')
          server = server_path.read_text().replace(
              'afterEmailVerification: async (user) => {',
              'afterEmailVerification: async (user: { id: string }) => {',
          )
          server_path.write_text(server)
          PY

      - name: Format and validate Prisma
        run: |
          pnpm db:format
          pnpm db:validate
          pnpm db:generate

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile

      - name: Targeted tests
        env:
          EMAIL_PROVIDER: disabled
        run: pnpm exec vitest run tests/account-email-verification.test.ts tests/transactional-email.test.ts tests/auth-config.test.ts

      - name: Full quality gate
        env:
          EMAIL_PROVIDER: disabled
        run: pnpm check

      - name: Remove temporary workflows
        run: rm .github/workflows/pr44-account-email-verification.yml .github/workflows/pr44-account-email-verification-fix.yml

      - name: Commit finalized PR 44
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add secure account email verification"
          git push origin HEAD:feat/account-email-verification
