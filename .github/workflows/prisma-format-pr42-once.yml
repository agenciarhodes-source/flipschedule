name: Prisma format PR 42 once

on:
  push:
    branches:
      - codex/implementar-recuperacao-segura-de-senha
    paths:
      - .github/workflows/prisma-format-pr42-once.yml

permissions:
  contents: write

concurrency:
  group: prisma-format-pr42-once
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/implementar-recuperacao-segura-de-senha
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Prisma schema
        run: pnpm db:format

      - name: Remove temporary workflow
        run: rm .github/workflows/prisma-format-pr42-once.yml

      - name: Commit formatted schema
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma .github/workflows/prisma-format-pr42-once.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were necessary."
            exit 1
          fi
          git commit -m "chore: format Prisma schema"
          git push origin HEAD:codex/implementar-recuperacao-segura-de-senha
